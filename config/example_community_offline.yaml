# Beispielgemeinschaft offline: gleiche Gemeinschaft wie config/example_community.yaml,
# aber alle Zeitreihen werden synthetisch und reproduzierbar (Seed) erzeugt.
# Braucht kein Netzwerk; gedacht für Tests, Demos ohne Internet und als Rückfall.
# Die synthetischen Daten sind plausibel, aber nicht real; Ergebnisse nur grob vergleichbar.
# Nicht angegebene Werte (z. B. Tarife außer eeg_type) kommen aus config/defaults.yaml.

name: Beispielgemeinschaft Linz (offline)  # Anzeigename der Gemeinschaft (Text, ohne Einheit)

period:                 # Betrachtungszeitraum
  year: 2023            # Referenzjahr (ganze Zahl); alle Zeitreihen werden darauf abgebildet

location:               # Standort der gemeinsamen PV-Anlage
  lat: 48.31            # Breitengrad in Grad Nord (Linz), bestimmt den Sonnenstand
  lon: 14.29            # Längengrad in Grad Ost (Linz), bestimmt den Sonnenstand

pv:                     # Gemeinsame PV-Anlage der Gemeinschaft
  source: synthetic     # Datenquelle: synthetic (Sonnenstand mal zufällige Bewölkung, offline)
  kwp: 30.0             # Spitzenleistung in kWp
  tilt_deg: 30          # Neigung in Grad (bei synthetic ohne Wirkung, zur Dokumentation)
  azimuth_deg: 0        # Ausrichtung in Grad, 0 = Süd (bei synthetic ohne Wirkung)
  loss_pct: 14          # Systemverluste in Prozent (bei synthetic ohne Wirkung)
  seed: 1               # Zufalls-Seed der PV-Reihe (ganze Zahl ≥ 0, ohne Einheit)

prices:                 # Spotpreise (nur für das Ziel „Kosten minimieren“)
  source: synthetic     # Datenquelle: synthetic (Tagesgang in ct/kWh, offline)
  seed: 1               # Zufalls-Seed der Preisreihe (ganze Zahl ≥ 0, ohne Einheit)

co2:                    # CO₂-Intensität des Netzstroms
  source: synthetic     # Datenquelle: synthetic (g CO₂/kWh mit Tagesgang, offline)
  seed: 1               # Zufalls-Seed der CO₂-Reihe (ganze Zahl ≥ 0, ohne Einheit)

tariffs:                # Tarife in ct/kWh brutto; nicht genannte Werte aus defaults.yaml (spec §7.1)
  eeg_type: local       # Art der Energiegemeinschaft: local (Netzebene 6/7, Netzentgelt −57 %) oder regional (−28 %)

households:             # Haushalte der Gemeinschaft (1 bis 15 Einträge)
  - id: hh01            # Eindeutige Haushalts-ID (Text)
    load:               # Grundlast des Haushalts ohne verschiebbare Geräte
      source: synthetic # Datenquelle: synthetic (Tagesgang mit Morgen- und Abendspitze, offline)
      annual_kwh: 3200  # Jahresverbrauch in kWh
      seed: 1           # Zufalls-Seed des Lastprofils (ganze Zahl ≥ 0, ohne Einheit)
    devices:            # Verschiebbare Geräte zusätzlich zur Grundlast (spec §7.2)
      - id: ev                     # E-Auto (Wallbox, Laden zu Hause)
        kind: modulating           # Art: modulating (Leistung frei zwischen 0 und power_kw)
        power_kw: 11.0             # Ladeleistung in kW (Wallbox dreiphasig)
        energy_kwh_per_day: 8.0    # Tagesbedarf in kWh (ca. 45 km Fahrt pro Tag)
        window:                    # Zeitfenster, in dem das Auto angesteckt ist
          start: "18:00"           # Beginn (Uhrzeit, Ankunft zu Hause)
          end: "07:00"             # Ende (Uhrzeit, Abfahrt am Folgetag)
        baseline_start: "18:00"    # Ist-Betrieb: Laden sofort nach der Ankunft (Uhrzeit)
      - id: washing_machine        # Waschmaschine (ein Lauf pro Tag, Vereinfachung)
        kind: program              # Art: program (feste Leistung und Dauer, nur der Start ist frei)
        power_kw: 1.0              # mittlere Leistung im Programm in kW
        duration_min: 60           # Programmdauer in Minuten (ganze Zahl, Vielfaches von 15)
        window:                    # Zeitfenster, in dem das Programm laufen darf
          start: "08:00"           # Beginn (Uhrzeit)
          end: "22:00"             # Ende (Uhrzeit, Programm muss bis dahin fertig sein)
        baseline_start: "19:00"    # Ist-Betrieb: Start am Abend (Uhrzeit)
  - id: hh02            # Eindeutige Haushalts-ID (Text)
    load:               # Grundlast des Haushalts ohne verschiebbare Geräte
      source: synthetic # Datenquelle: synthetic (Tagesgang mit Morgen- und Abendspitze, offline)
      annual_kwh: 1400  # Jahresverbrauch in kWh (kleiner Haushalt)
      seed: 2           # Zufalls-Seed des Lastprofils (ganze Zahl ≥ 0, ohne Einheit)
    devices:            # Verschiebbare Geräte zusätzlich zur Grundlast (spec §7.2)
      - id: dishwasher             # Geschirrspüler (ein Lauf pro Tag, Vereinfachung)
        kind: program              # Art: program (feste Leistung und Dauer, nur der Start ist frei)
        power_kw: 1.2              # mittlere Leistung im Programm in kW
        duration_min: 60           # Programmdauer in Minuten (ganze Zahl, Vielfaches von 15)
        window:                    # Zeitfenster: nach dem Abendessen bis zum nächsten Nachmittag
          start: "20:00"           # Beginn (Uhrzeit)
          end: "17:00"             # Ende (Uhrzeit, Folgetag)
        baseline_start: "20:00"    # Ist-Betrieb: Start gleich nach dem Einräumen (Uhrzeit)
  - id: hh03            # Eindeutige Haushalts-ID (Text)
    load:               # Grundlast des Haushalts ohne verschiebbare Geräte
      source: synthetic # Datenquelle: synthetic (Tagesgang mit Morgen- und Abendspitze, offline)
      annual_kwh: 4500  # Jahresverbrauch in kWh
      seed: 3           # Zufalls-Seed des Lastprofils (ganze Zahl ≥ 0, ohne Einheit)
    devices:            # Verschiebbare Geräte zusätzlich zur Grundlast (spec §7.2)
      # Wärmepumpe vereinfacht (spec §7.2): fester Tagesbedarf ohne Gebäudeträgheit
      # und ohne Komfortgrenzen, deshalb nur das enge Fenster 10:00 bis 16:00.
      - id: heat_pump              # Wärmepumpe (Vereinfachung laut spec §7.2, siehe oben)
        kind: modulating           # Art: modulating (fester Tagesbedarf, Leistung frei zwischen 0 und power_kw)
        power_kw: 2.5              # elektrische Leistung in kW
        energy_kwh_per_day: 8.0    # elektrischer Tagesbedarf in kWh (Jahresmittel)
        window:                    # enges Zeitfenster laut spec §7.2
          start: "10:00"           # Beginn (Uhrzeit)
          end: "16:00"             # Ende (Uhrzeit)
        baseline_start: "10:00"    # Ist-Betrieb: Start zu Fensterbeginn (Uhrzeit)
      - id: dishwasher             # Geschirrspüler (ein Lauf pro Tag, Vereinfachung)
        kind: program              # Art: program (feste Leistung und Dauer, nur der Start ist frei)
        power_kw: 1.2              # mittlere Leistung im Programm in kW
        duration_min: 60           # Programmdauer in Minuten (ganze Zahl, Vielfaches von 15)
        window:                    # Zeitfenster: nach dem Abendessen bis zum nächsten Nachmittag
          start: "20:00"           # Beginn (Uhrzeit)
          end: "17:00"             # Ende (Uhrzeit, Folgetag)
        baseline_start: "20:00"    # Ist-Betrieb: Start gleich nach dem Einräumen (Uhrzeit)
  - id: hh04            # Eindeutige Haushalts-ID (Text)
    load:               # Grundlast des Haushalts ohne verschiebbare Geräte
      source: synthetic # Datenquelle: synthetic (Tagesgang mit Morgen- und Abendspitze, offline)
      annual_kwh: 2600  # Jahresverbrauch in kWh
      seed: 4           # Zufalls-Seed des Lastprofils (ganze Zahl ≥ 0, ohne Einheit)
    devices:            # Verschiebbare Geräte zusätzlich zur Grundlast (spec §7.2)
      - id: boiler                 # Elektro-Warmwasserboiler
        kind: modulating           # Art: modulating (Heizstab, Leistung frei zwischen 0 und power_kw)
        power_kw: 2.0              # Heizleistung in kW
        energy_kwh_per_day: 5.0    # Tagesbedarf Warmwasser in kWh
        window:                    # Zeitfenster, in dem geheizt werden darf (Speicher puffert)
          start: "08:00"           # Beginn (Uhrzeit)
          end: "06:00"             # Ende (Uhrzeit, Folgetag, vor dem Duschen am Morgen)
        baseline_start: "22:00"    # Ist-Betrieb: Heizen ab 22 Uhr wie mit Nachtstrom (Uhrzeit)
      - id: washing_machine        # Waschmaschine (ein Lauf pro Tag, Vereinfachung)
        kind: program              # Art: program (feste Leistung und Dauer, nur der Start ist frei)
        power_kw: 1.0              # mittlere Leistung im Programm in kW
        duration_min: 60           # Programmdauer in Minuten (ganze Zahl, Vielfaches von 15)
        window:                    # Zeitfenster, in dem das Programm laufen darf
          start: "08:00"           # Beginn (Uhrzeit)
          end: "22:00"             # Ende (Uhrzeit, Programm muss bis dahin fertig sein)
        baseline_start: "19:00"    # Ist-Betrieb: Start am Abend (Uhrzeit)
  - id: hh05            # Eindeutige Haushalts-ID (Text)
    load:               # Grundlast des Haushalts ohne verschiebbare Geräte
      source: synthetic # Datenquelle: synthetic (Tagesgang mit Morgen- und Abendspitze, offline)
      annual_kwh: 8600  # Jahresverbrauch in kWh (großer Haushalt)
      seed: 5           # Zufalls-Seed des Lastprofils (ganze Zahl ≥ 0, ohne Einheit)
    devices:            # Verschiebbare Geräte zusätzlich zur Grundlast (spec §7.2)
      - id: ev                     # E-Auto (Wallbox, Laden zu Hause)
        kind: modulating           # Art: modulating (Leistung frei zwischen 0 und power_kw)
        power_kw: 11.0             # Ladeleistung in kW (Wallbox dreiphasig)
        energy_kwh_per_day: 8.0    # Tagesbedarf in kWh (ca. 45 km Fahrt pro Tag)
        window:                    # Zeitfenster, in dem das Auto angesteckt ist
          start: "18:00"           # Beginn (Uhrzeit, Ankunft zu Hause)
          end: "07:00"             # Ende (Uhrzeit, Abfahrt am Folgetag)
        baseline_start: "18:00"    # Ist-Betrieb: Laden sofort nach der Ankunft (Uhrzeit)
      # Wärmepumpe vereinfacht (spec §7.2): fester Tagesbedarf ohne Gebäudeträgheit
      # und ohne Komfortgrenzen, deshalb nur das enge Fenster 10:00 bis 16:00.
      - id: heat_pump              # Wärmepumpe (Vereinfachung laut spec §7.2, siehe oben)
        kind: modulating           # Art: modulating (fester Tagesbedarf, Leistung frei zwischen 0 und power_kw)
        power_kw: 2.5              # elektrische Leistung in kW
        energy_kwh_per_day: 8.0    # elektrischer Tagesbedarf in kWh (Jahresmittel)
        window:                    # enges Zeitfenster laut spec §7.2
          start: "10:00"           # Beginn (Uhrzeit)
          end: "16:00"             # Ende (Uhrzeit)
        baseline_start: "10:00"    # Ist-Betrieb: Start zu Fensterbeginn (Uhrzeit)
      - id: boiler                 # Elektro-Warmwasserboiler
        kind: modulating           # Art: modulating (Heizstab, Leistung frei zwischen 0 und power_kw)
        power_kw: 2.0              # Heizleistung in kW
        energy_kwh_per_day: 5.0    # Tagesbedarf Warmwasser in kWh
        window:                    # Zeitfenster, in dem geheizt werden darf (Speicher puffert)
          start: "08:00"           # Beginn (Uhrzeit)
          end: "06:00"             # Ende (Uhrzeit, Folgetag, vor dem Duschen am Morgen)
        baseline_start: "22:00"    # Ist-Betrieb: Heizen ab 22 Uhr wie mit Nachtstrom (Uhrzeit)
      - id: washing_machine        # Waschmaschine (ein Lauf pro Tag, Vereinfachung)
        kind: program              # Art: program (feste Leistung und Dauer, nur der Start ist frei)
        power_kw: 1.0              # mittlere Leistung im Programm in kW
        duration_min: 60           # Programmdauer in Minuten (ganze Zahl, Vielfaches von 15)
        window:                    # Zeitfenster, in dem das Programm laufen darf
          start: "08:00"           # Beginn (Uhrzeit)
          end: "22:00"             # Ende (Uhrzeit, Programm muss bis dahin fertig sein)
        baseline_start: "19:00"    # Ist-Betrieb: Start am Abend (Uhrzeit)
      - id: dishwasher             # Geschirrspüler (ein Lauf pro Tag, Vereinfachung)
        kind: program              # Art: program (feste Leistung und Dauer, nur der Start ist frei)
        power_kw: 1.2              # mittlere Leistung im Programm in kW
        duration_min: 60           # Programmdauer in Minuten (ganze Zahl, Vielfaches von 15)
        window:                    # Zeitfenster: nach dem Abendessen bis zum nächsten Nachmittag
