[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-optimizer"
version = "0.1.0"
description = "Simulation und Optimierung des Eigenverbrauchs einer kleinen Energiegemeinschaft"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pvlib>=0.11",
    "pulp>=2.9,<3",  # 3.x/4.x: breaking API + CBC unbundled, see docs/architecture.md
    "requests>=2.31",
    "pyyaml>=6.0",
    "pyarrow>=15",
    "streamlit>=1.38",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "playwright>=1.47",
    "pytest-playwright>=0.5",
    "pandas-stubs>=2.2",
    "types-PyYAML",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "BLE", "S", "DTZ", "PD", "NPY"]
ignore = [
    "PLR0913",  # many args are normal for numeric functions
    "PLR2004",  # magic values ok in domain code with named constants preferred
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603", "S607", "S310"]
"app/**" = ["PLC0415"]
"scripts/**" = ["S603", "S607", "PLR0912"]  # git subprocess calls with fixed args

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "app", "tests", "scripts"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pvlib.*", "pulp.*", "plotly.*", "pyarrow.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network and not e2e and not slow' -p no:cacheprovider"
timeout = 300
markers = [
    "network: calls real external APIs (opt-in only)",
    "e2e: Playwright tests against the running Streamlit app",
    "slow: performance tests (INV-5)",
]
filterwarnings = [
    "error::FutureWarning",
    # third-party: pytest-playwright's base_url fixture (not our code)
    "ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning",
]
